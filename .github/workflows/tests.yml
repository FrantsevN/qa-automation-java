name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # GitHub sets CI=true, so Chrome runs headless. Google Chrome is preinstalled on the runner.
      - name: Run tests
        run: mvn -B test

      - name: Build Allure report
        if: always()
        run: npx --yes allure-commandline generate target/allure-results --clean -o allure-report

      # The report is published from the default branch only, also when tests fail.
      - name: Upload report for GitHub Pages
        if: always() && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  publish-report:
    needs: test
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
