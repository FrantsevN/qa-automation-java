org.slf4j.simpleLogger.defaultLogLevel=warn

# The auth token is requested once per class in @BeforeAll, before any test has started, so Allure has no
# test to attach that request to and logs an error for it. The request is set up, not a check, and the
# token endpoint has its own tests in AuthTest, so this message is switched off.
org.slf4j.simpleLogger.log.io.qameta.allure.AllureLifecycle=off
